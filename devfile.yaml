schemaVersion: 2.2.0
attributes:
  controller.devfile.io/storage-type: per-workspace
metadata:
  name: code-assistant-sandbox
projects:
  - name: code-assistant-sandbox
    git:
      remotes:
        origin: https://github.com/cgruver/code-assistant-sandbox.git
      checkoutFrom:
        remote: origin
        revision: main
components:
- name: dev-tools
  attributes:
    container-overrides:
      imagePullPolicy: Always
  container:
    image: image-registry.openshift-image-registry.svc:5000/workspace-images/cajun-navy:latest
    # image: quay.io/cgruver0/che/workspace-base:latest
    memoryLimit: 12Gi
    memoryRequest: 2Gi
    cpuLimit: 4000m
    cpuRequest: 100m
    mountSources: true
    env:
    - name: SHELL
      value: "/bin/zsh"
    - name: HOME
      value: "/projects"
    - name: VSCODE_DEFAULT_WORKSPACE
      value: "/projects/code-assistant-sandbox/code-assistant-sandbox.code-workspace"
    - name: OPENCODE_CONFIG
      value: /projects/.globalconfig/opencode.json
    endpoints:
      - exposure: none
        name: kilo-service
        protocol: tcp
        targetPort: 4096
- volume:
    size: 50Gi
  name: projects
commands:
- id: init-workspace
  exec:
    workingDir: ${PROJECT_SOURCE}/scripts
    commandLine: "./init.sh --init"
    component: dev-tools
- id: reset-workspace
  exec:
    workingDir: ${PROJECT_SOURCE}/scripts
    commandLine: "./init.sh --reset"
    component: dev-tools
    
